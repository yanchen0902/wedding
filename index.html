/* ===== styles.css ===== */
/* ==========================================================
   Wedding invitation — base styles
   ========================================================== */

:root {
  --ivory: #F6F4ED;
  --ivory-soft: #EFEBE0;
  --sage: #A8B5A0;
  --sage-deep: #5C6B53;
  --sage-mist: #C9D2C2;
  --ink: #2A2E2A;
  --ink-soft: #5A5E58;
  --rule: rgba(42,46,42,0.18);

  --serif: "Cormorant Garamond", "Noto Serif TC", "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --tc: "Noto Serif TC", "Cormorant Garamond", serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* hide scrollbars on the snow carousel track */
.snow-track::-webkit-scrollbar { display: none; }

/* ==========================================================
   Refined animations (Variant A — elegant & precious)
   ========================================================== */

/* Initial-state helpers: elements that will be animated start in their
   "before" state so the JS-less fallback also looks intentional. */
.a-pre { opacity: 0; }

/* Hero entrance keyframes */
@keyframes a-fade-up {
  0%   { opacity: 0; transform: translate3d(0, 22px, 0); filter: blur(8px); }
  60%  { filter: blur(2px); }
  100% { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0); }
}
@keyframes a-fade-down {
  from { opacity: 0; transform: translate3d(0, -12px, 0); }
  to   { opacity: 1; transform: translate3d(0, 0, 0); }
}
@keyframes a-fade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes a-plate-in {
  from { opacity: 0; transform: scale(0.965); filter: blur(10px); }
  to   { opacity: 1; transform: scale(1); filter: blur(0); }
}
@keyframes a-rule-grow {
  from { width: 0; opacity: 0; }
  to   { width: 40px; opacity: 1; }
}
@keyframes a-ken-burns {
  0%   { transform: scale(1.04) translate3d(0,0,0); }
  50%  { transform: scale(1.10) translate3d(-1.2%, -0.8%, 0); }
  100% { transform: scale(1.04) translate3d(0,0,0); }
}
@keyframes a-flake-pulse {
  0%, 100% { opacity: 0.55; transform: scale(1) rotate(0deg); }
  50%      { opacity: 1;    transform: scale(1.18) rotate(45deg); }
}
@keyframes a-hairline {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}

/* Hero plate */
.hero-photo-fade {
  position: absolute; inset: 0;
  z-index: 0;
  /* Solid-color placeholder shown until the JPEG paints —
     subtly toned toward the photo's mid-tones (warm sage) so the
     transition is less jarring than pure ivory flash. */
  background: #6a6f5e;
}
.hero-photo-layer {
  position: absolute; inset: 0;
  background-size: cover;
  animation: a-ken-burns 24s ease-in-out infinite;
  will-change: transform;
}
.hero-vignette {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 22% 50%, rgba(0,0,0,0.10) 0%, transparent 55%),
    linear-gradient(180deg, rgba(0,0,0,0.10) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.18) 100%);
  z-index: 1;
  pointer-events: none;
}

/* Generic animate-on-mount helper. Use --d for delay (ms). */
.a-anim {
  opacity: 0;
  animation-duration: 700ms;
  animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
  animation-fill-mode: forwards;
  animation-iteration-count: 1;
  animation-delay: var(--d, 0ms);
  will-change: opacity, transform, filter;
}
.a-anim.a-up        { animation-name: a-fade-up; }
.a-anim.a-down      { animation-name: a-fade-down; animation-duration: 600ms; }
.a-anim.a-in        { animation-name: a-fade; }
.a-anim.a-plate     { animation-name: a-plate-in; animation-duration: 900ms; }

/* Decorative pulse on the snowflake divider */
.a-flake { display: inline-block; animation: a-flake-pulse 4.5s ease-in-out infinite; transform-origin: center; }

/* Scroll arrow nudge */
@keyframes a-arrow-nudge {
  0%, 100% { transform: translateY(0); opacity: 0.55; }
  50%      { transform: translateY(4px); opacity: 1; }
}
.a-scroll-arrow {
  display: inline-block;
  animation: a-arrow-nudge 2.4s ease-in-out infinite;
}

/* Hairline rules (the two lines flanking the snowflake) — grow from center */
.a-rule {
  display: inline-block;
  width: 40px;
  height: 1px;
  background: var(--sage-deep);
  transform-origin: center;
  transform: scaleX(0);
  animation: a-hairline 600ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  animation-delay: var(--d, 0ms);
}

/* ==========================================================
   Reveal-on-scroll (IntersectionObserver toggles .is-in)
   ========================================================== */
.reveal {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  filter: blur(6px);
  transition:
    opacity 1100ms cubic-bezier(0.22, 0.61, 0.36, 1),
    transform 1100ms cubic-bezier(0.22, 0.61, 0.36, 1),
    filter 900ms cubic-bezier(0.22, 0.61, 0.36, 1);
  transition-delay: var(--d, 0ms);
  will-change: opacity, transform, filter;
}
.reveal.is-in {
  opacity: 1;
  transform: translate3d(0, 0, 0);
  filter: blur(0);
}
.reveal-soft {
  opacity: 0;
  transition: opacity 1200ms ease;
  transition-delay: var(--d, 0ms);
}
.reveal-soft.is-in { opacity: 1; }

/* Photo lift on hover (gallery, wardrobe) */
.photo-lift {
  overflow: hidden;
  position: relative;
}
.photo-lift > .photo,
.photo-lift > .photo-real {
  transition: transform 1400ms cubic-bezier(0.22, 0.61, 0.36, 1), filter 800ms ease;
  will-change: transform;
}
.photo-lift:hover > .photo,
.photo-lift:hover > .photo-real {
  transform: scale(1.04);
  filter: saturate(1.08);
}

/* "Real" image holder for gallery strip cards (used where bg-image is set) */
.photo-real {
  background-size: cover;
  background-position: center;
}

/* Schedule row hover */
.sched-row {
  transition: background-color 400ms ease, padding 400ms ease;
}
.sched-row:hover {
  background: rgba(168,181,160,0.06);
}

/* Refined button micro-interaction */
.btn {
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
  transform: translateX(-100%);
  transition: transform 900ms ease;
  pointer-events: none;
}
.btn:hover::after { transform: translateX(100%); }

/* Respect motion preference */
@media (prefers-reduced-motion: reduce) {
  .a-anim, .a-rule, .reveal, .reveal-soft, .hero-photo-layer, .a-flake {
    animation: none !important;
    transition: none !important;
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
  }
}

/* ==========================================================
   Snow effect (shared)
   ========================================================== */
.snow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 1;
}
.snow span {
  position: absolute;
  top: -10%;
  display: block;
  color: rgba(255,255,255,0.9);
  font-size: 10px;
  text-shadow: 0 0 4px rgba(255,255,255,0.5);
  animation: snowfall linear infinite;
  user-select: none;
}
@keyframes snowfall {
  0%   { transform: translate3d(0,-10vh,0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.9; }
  90%  { opacity: 0.9; }
  100% { transform: translate3d(var(--drift, 20px), 110vh, 0) rotate(360deg); opacity: 0; }
}

/* ==========================================================
   Section-shared
   ========================================================== */
.invite {
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--sans);
  width: 100%;
  position: relative;
}

.invite h1, .invite h2, .invite h3, .invite h4 {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: 0.005em;
  margin: 0;
}
.invite p { margin: 0; line-height: 1.65; color: var(--ink-soft); }
.invite .tc { font-family: var(--tc); }

.eyebrow {
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--sage-deep);
  font-weight: 500;
}

.rule {
  display: inline-block;
  width: 36px;
  height: 1px;
  background: var(--sage-deep);
  vertical-align: middle;
  margin: 0 14px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--ivory);
  border: 1px solid var(--ink);
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
}
.btn:hover { background: var(--sage-deep); border-color: var(--sage-deep); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--ivory); border-color: var(--ink); }

/* placeholder photo blocks */
.photo {
  background:
    repeating-linear-gradient(135deg,
      rgba(168,181,160,0.18) 0 12px,
      rgba(168,181,160,0.08) 12px 24px),
    var(--ivory-soft);
  border: 1px solid var(--rule);
  position: relative;
  overflow: hidden;
}
.photo::after {
  content: attr(data-label);
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "JetBrains Mono", "Courier New", monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--sage-deep);
  text-transform: uppercase;
}

/* ==========================================================
   Background textures (selectable via tweaks)
   ========================================================== */
.tex-plain  { background: var(--ivory); }
.tex-paper  {
  background:
    radial-gradient(circle at 20% 30%, rgba(168,181,160,0.06) 0, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(92,107,83,0.05) 0, transparent 40%),
    var(--ivory);
}
.tex-grain {
  background-color: var(--ivory);
  background-image:
    radial-gradient(rgba(42,46,42,0.04) 1px, transparent 1px),
    radial-gradient(rgba(42,46,42,0.03) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 2px;
}
.tex-linen {
  background:
    repeating-linear-gradient(0deg,
      rgba(168,181,160,0.06) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(90deg,
      rgba(92,107,83,0.05) 0 2px, transparent 2px 4px),
    var(--ivory);
}

/* ==========================================================
   Section (shared component)
   ========================================================== */
.section {
  padding: 96px 64px;
  position: relative;
  z-index: 2;
}
.section-head {
  text-align: center;
  margin-bottom: 56px;
}
.section-head .eyebrow { display: block; margin-bottom: 18px; }
.section-head h2 {
  font-size: 56px;
  line-height: 1.05;
}
.section-head .sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
  color: var(--ink-soft);
  margin-top: 14px;
}

/* ==========================================================
   Forms
   ========================================================== */
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.field label {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--sage-deep);
  font-weight: 500;
}
.field input, .field select, .field textarea {
  font-family: var(--serif);
  font-size: 18px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 10px 0;
  color: var(--ink);
  outline: none;
  border-radius: 0;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-bottom-color: var(--sage-deep);
}
.radio-row {
  display: flex;
  gap: 12px;
  margin-top: 4px;
}
.radio-pill {
  flex: 1;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s ease;
  background: transparent;
  font-family: var(--sans);
  color: var(--ink-soft);
}
.radio-pill.active {
  background: var(--ink);
  color: var(--ivory);
  border-color: var(--ink);
}

/* ==========================================================
   Tweaks panel custom
   ========================================================== */
.swatch-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.swatch {
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.swatch.active { border-color: white; outline: 2px solid #2A2E2A; }


/* ==========================================================
   Floating RSVP Envelope
   ========================================================== */
.env-scrim {
  position: fixed;
  inset: 0;
  background: rgba(28, 32, 28, 0.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 420ms cubic-bezier(0.22, 0.61, 0.36, 1);
  z-index: 200;
}
.env-scrim.visible {
  opacity: 1;
  pointer-events: auto;
}

.env-wrap {
  position: fixed;
  z-index: 201;
  cursor: pointer;
  transition:
    top 720ms cubic-bezier(0.22, 0.61, 0.36, 1),
    right 720ms cubic-bezier(0.22, 0.61, 0.36, 1),
    width 720ms cubic-bezier(0.22, 0.61, 0.36, 1),
    height 720ms cubic-bezier(0.22, 0.61, 0.36, 1),
    transform 720ms cubic-bezier(0.22, 0.61, 0.36, 1);
  outline: none;
}
.env-wrap:focus-visible .env-shell {
  box-shadow:
    0 0 0 3px var(--ivory),
    0 0 0 5px var(--sage-deep),
    0 24px 60px rgba(42,46,42,0.18);
}

/* ----- States ----- */
.env-peek {
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  width: 76px;
  height: 54px;
}
.env-prominent {
  right: 6vw;
  top: 50%;
  transform: translateY(-50%);
  width: 280px;
  height: 220px;
}
.env-open {
  right: 50%;
  top: 50%;
  transform: translate(50%, -50%);
  width: min(560px, 92vw);
  height: min(720px, 90vh);
  cursor: default;
}

/* ----- Shell ----- */
.env-shell {
  position: absolute;
  inset: 0;
  background: var(--sage-deep);
  border: 1px solid var(--sage-deep);
  border-radius: 8px;
  box-shadow:
    0 14px 36px rgba(42,46,42,0.22),
    0 4px 12px rgba(42,46,42,0.10);
  transition:
    box-shadow 420ms cubic-bezier(0.22, 0.61, 0.36, 1),
    border-color 420ms ease;
  overflow: hidden;
}
.env-peek .env-shell { border-radius: 6px; }
.env-open .env-shell { border-radius: 10px; }
.env-prominent .env-shell {
  box-shadow:
    0 28px 70px rgba(42,46,42,0.22),
    0 8px 18px rgba(42,46,42,0.10);
}
.env-open .env-shell {
  box-shadow:
    0 40px 90px rgba(42,46,42,0.28),
    0 10px 24px rgba(42,46,42,0.14);
}

/* ----- Back face (labels visible when closed) ----- */
.env-back {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* No z-index here on purpose: setting one creates a stacking context
     that traps child elements (like .env-peek-seal) below the flap.
     Stacking is governed by document order + the seal's own z-index. */
  transition: opacity 320ms ease;
  color: var(--ivory);
}
.env-open .env-back {
  opacity: 0;
  pointer-events: none;
}

.env-peek-icon {
  display: none;
  color: var(--ivory);
}
.env-peek .env-peek-icon { display: block; }

.env-check {
  font-family: var(--serif);
  font-size: 26px;
  color: var(--ivory);
  font-weight: 500;
}
.env-glyph svg { display: block; }

/* Peek-state mini wax seal — same aesthetic as prominent seal, scaled down */
.env-peek-seal {
  display: block;
  width: 22px;
  height: 22px;
  /* Stack above the flap (z-index 3) so the seal sits ON TOP of the flap tip,
     matching how the prominent seal overlaps its flap. */
  position: relative;
  z-index: 6;
  border-radius: 49% 51% 50% 50% / 50% 49% 51% 50%;
  background:
    radial-gradient(circle at 35% 28%,
      #ECC988 0%,
      #C99E5A 35%,
      #8E6B30 75%,
      #5A3E18 100%);
  box-shadow:
    0 2px 4px rgba(40,25,8,0.45),
    0 1px 2px rgba(40,25,8,0.22),
    inset 1px 1px 2px rgba(255,232,170,0.55),
    inset -1px -1px 2px rgba(50,32,10,0.55),
    inset 0 0 3px rgba(40,25,8,0.3);
  transform: rotate(-6deg);
  transition: transform 320ms cubic-bezier(0.22, 0.61, 0.36, 1),
              box-shadow 240ms ease;
}
@media (hover: hover) {
  .env-peek:hover .env-peek-seal {
    transform: rotate(-2deg) scale(1.12);
    box-shadow:
      0 3px 7px rgba(159, 122, 58, 0.5),
      0 1px 2px rgba(40,25,8,0.25),
      inset 1px 1px 2px rgba(255,232,170,0.65),
      inset -1px -1px 2px rgba(50,32,10,0.6),
      inset 0 0 3px rgba(40,25,8,0.3);
  }
}

.env-prominent-body {
  display: none;
  text-align: center;
  padding: 0 20px;
}
.env-prominent .env-back {
  /* Flap occupies top — anchor content to the lower half so it sits
     in the clear sage-deep area below the flap's triangle tip.
     Smaller padding-bottom = title sits lower = more clearance from flap. */
  align-items: flex-end;
  padding-bottom: 18px;
}
.env-prominent .env-prominent-body { display: block; }

.env-mono-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--sage-mist);
}

.env-glyph-large {
  margin: 0 auto 14px;
  color: var(--ivory);
  opacity: 0.75;
}

.env-prominent-title {
  font-family: var(--tc);
  font-size: 30px;
  letter-spacing: 0.22em;
  font-weight: 400;
  color: var(--ivory);
  margin-top: 0;
  line-height: 1.2;
  text-indent: 0.22em;
}
.env-prominent-sub {
  font-family: var(--tc);
  font-size: 12px;
  letter-spacing: 0.32em;
  color: var(--sage-mist);
  margin-top: 14px;
  text-indent: 0.32em;
}
.env-prominent-rule {
  margin: 16px auto 0;
  width: 24px;
  height: 1px;
  background: var(--sage-mist);
}

/* ----- Flap (decorative top triangle, lifts on open) ----- */
.env-flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 48%;
  background: var(--ink);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transform: rotateX(0deg);
  transition:
    transform 720ms cubic-bezier(0.22, 0.61, 0.36, 1),
    opacity 320ms ease 280ms;
  z-index: 3;
  pointer-events: none;
}
.env-open .env-flap {
  transform: rotateX(180deg) translateY(2px);
  opacity: 0;
}
/* Hairline highlight along the flap's slanting edges */
.env-flap-shadow {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 48%;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  background:
    linear-gradient(to bottom, rgba(0,0,0,0.18) 0%, transparent 28%),
    linear-gradient(to bottom, transparent 96%, rgba(246,244,237,0.10) 100%);
  z-index: 4;
  pointer-events: none;
  transition: opacity 320ms ease;
}
.env-open .env-flap-shadow { opacity: 0; }

/* ----- Wax seal — golden Y & A monogram at flap tip -----
   Layered effect:
   .env-seal       → outer wax disc (irregular shape, raised rim)
   .env-seal::before → inner debossed area (pressed in by stamp)
   .env-seal-text  → monogram, pressed into the wax */
.env-seal {
  position: absolute;
  top: 48%;
  left: 50%;
  width: 52px;
  height: 52px;
  /* Irregular "squeezed wax" rim — not a perfect circle */
  border-radius: 49% 51% 50% 50% / 50% 49% 51% 50%;
  background:
    radial-gradient(circle at 35% 28%,
      #ECC988 0%,
      #C99E5A 32%,
      #8E6B30 72%,
      #5A3E18 100%);
  box-shadow:
    /* drop shadow — seal lifted off envelope */
    0 4px 10px rgba(40,25,8,0.42),
    0 2px 3px rgba(40,25,8,0.22),
    /* outer rim highlight (light from top-left catches the raised lip) */
    inset 2px 2px 4px rgba(255,232,170,0.55),
    /* outer rim shadow (bottom-right far side of lip) */
    inset -2px -2px 5px rgba(50,32,10,0.55),
    /* inner edge dark transition — where rim meets sunken center */
    inset 4px 4px 6px rgba(70,45,16,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 6;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) rotate(-6deg) scale(0.92);
  transition:
    opacity 360ms ease,
    transform 520ms cubic-bezier(0.22, 0.61, 0.36, 1),
    box-shadow 320ms ease;
}

/* Inner debossed/pressed-in area where the stamp made contact */
.env-seal::before {
  content: "";
  position: absolute;
  inset: 5px;
  /* Slightly different irregular shape so the deboss doesn't echo the rim exactly */
  border-radius: 51% 49% 50% 51% / 49% 51% 49% 51%;
  background:
    radial-gradient(circle at 65% 72%,
      #B58E48 0%,
      #8E6B30 55%,
      #5A3E18 100%);
  box-shadow:
    /* DEBOSSED — top-left wall in shadow (light blocked by rim) */
    inset 2px 2px 4px rgba(35,20,5,0.65),
    /* opposite far wall catches light bouncing in */
    inset -1px -1px 3px rgba(255,220,140,0.22),
    /* subtle inner depth */
    inset 0 0 6px rgba(40,25,8,0.25);
  z-index: 0;
}

.env-prominent .env-seal {
  opacity: 1;
  transform: translate(-50%, -50%) rotate(-6deg) scale(1);
}
.env-open .env-seal {
  opacity: 0;
  transform: translate(-50%, -50%) rotate(-6deg) scale(0.7);
  transition-delay: 0ms;
}

.env-seal-text {
  position: relative;
  z-index: 2;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 500;
  color: #2E1F08;
  letter-spacing: 0.02em;
  line-height: 1;
  /* Pressed-in text: dark shadow above (top wall of recess) +
     subtle warm highlight below (light catches bottom edge) */
  text-shadow:
    0 -1px 0 rgba(20,12,2,0.7),
    0 1px 0 rgba(255,225,150,0.32),
    1px 0 1px rgba(20,12,2,0.3);
  user-select: none;
}
.env-seal-text i {
  font-style: italic;
  font-weight: 400;
  margin: 0 1px;
  opacity: 0.85;
}

/* Hover — wax catches more light, debossed area deepens slightly */
@media (hover: hover) {
  .env-prominent:hover .env-seal {
    transform: translate(-50%, -50%) rotate(-2deg) scale(1.08);
    box-shadow:
      0 7px 18px rgba(159, 122, 58, 0.48),
      0 3px 5px rgba(40,25,8,0.28),
      inset 2px 2px 5px rgba(255,232,170,0.65),
      inset -2px -2px 6px rgba(50,32,10,0.6),
      inset 4px 4px 7px rgba(70,45,16,0.4);
  }
  .env-prominent:hover .env-seal::before {
    box-shadow:
      inset 2px 2px 5px rgba(35,20,5,0.75),
      inset -1px -1px 3px rgba(255,220,140,0.28),
      inset 0 0 7px rgba(40,25,8,0.3);
  }
}

@media (prefers-reduced-motion: reduce) {
  .env-seal,
  .env-seal::before {
    transition-duration: 1ms !important;
  }
}

/* ----- Letter (RSVP form, visible only when open) -----
   Outer .env-letter is the sage-deep envelope frame;
   inner .env-letter-inner is the ivory paper inside it. */
.env-letter {
  position: absolute;
  inset: 0;
  background: var(--sage-deep);
  padding: 18px;
  opacity: 0;
  transform: translateY(24px);
  pointer-events: none;

/* Hover lift on closed states */

function Snowfall({ count = 40 }) {
  const flakes = React.useMemo(() => {
    return Array.from({ length: count }).map((_, i) => {
      const depth = Math.random();                     // 0..1 → far/near
      const left = Math.random() * 100;
      const dur = 14 + (1 - depth) * 16;               // far = slower
      const delay = -Math.random() * 30;
      const size = 4 + depth * 16;                     // far = smaller
      const opacity = 0.25 + depth * 0.55;
      const blur = depth < 0.35 ? 1.5 : depth < 0.7 ? 0.5 : 0;

      const ch = Math.random() > 0.6 ? "❄" : Math.random() > 0.4 ? "❅" : "·";

function Reveal({ as = "div", delay = 0, soft = false, children, className = "", style, ...rest }) {
  const Tag = as;
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    // Already in view at mount? (e.g. zoomed-out canvas) → reveal after a beat.
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          el.classList.add("is-in");
          io.unobserve(el);
        }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <Tag
      ref={ref}
      className={(soft ? "reveal-soft " : "reveal ") + className}
      style={{ "--d": `${delay}ms`, ...(style || {}) }}
      {...rest}
    >{children}</Tag>
  );
}

function RSVPForm({ storageKey }) {
  const [form, setForm] = React.useState(() => {
    try {
      const raw = localStorage.getItem(storageKey);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      name: "", email: "", attending: "", guests: "1",
      meal: "", song: "", note: "",
    };
  });
  const [submitted, setSubmitted] = React.useState(false);

  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const submit = (e) => {
    e.preventDefault();
    const list = JSON.parse(localStorage.getItem(storageKey + "-list") || "[]");
    list.push({ ...form, ts: new Date().toISOString() });
    localStorage.setItem(storageKey + "-list", JSON.stringify(list));
    localStorage.setItem(storageKey, JSON.stringify(form));
    setSubmitted(true);
    // Notify other components (RsvpStatus, FloatingRsvpEnvelope peek state) to update
    window.dispatchEvent(new CustomEvent("rsvp-updated"));
  };

  if (submitted) {
    return (
      <div style={{

        <button className="btn ghost" style={{ marginTop: 32 }}

  return (
    <form onSubmit={submit} style={{

            placeholder="your@email.com"
            onChange={e => update("email", e.target.value)} />

        <label>是否出席 · Attendance</label>

          {[
            { v: "yes", l: "誠摯出席" },
            { v: "no",  l: "未克前來" },
          ].map(o => (
            <button key={o.v} type="button"
              className={"radio-pill tc " + (form.attending === o.v ? "active" : "")}
              style={{ fontFamily: "var(--tc)", letterSpacing: "0.24em", fontSize: 14 }}
              onClick={() => update("attending", o.v)}>
              {o.l}
            </button>
          ))}

      </div>

      {form.attending === "yes" && (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 28 }}>
            <div className="field">
              <label>出席人數 · Guests</label>
              <select value={form.guests} onChange={e => update("guests", e.target.value)}>
                <option value="1">1 位 — 我自己</option>
                <option value="2">2 位 — 攜伴</option>
                <option value="3">3 位</option>
                <option value="4">4 位</option>

            </div>
            <div className="field">
              <label>飲食偏好 · Meal</label>
              <select value={form.meal} onChange={e => update("meal", e.target.value)}>
                <option value="">請選擇…</option>
                <option value="omnivore">主廚特選套餐</option>

/* ==========================================================

   Reads localStorage; shows status + hint to scroll back to envelope.
   ========================================================== */
function RsvpStatus({ storageKey }) {
  const [response, setResponse] = React.useState(null);

  React.useEffect(() => {
    const read = () => {
      try {
        const raw = localStorage.getItem(storageKey);
        const parsed = raw ? JSON.parse(raw) : null;
        setResponse(parsed && parsed.name && parsed.attending ? parsed : null);
      } catch (e) { setResponse(null); }
    };
    read();
    window.addEventListener("rsvp-updated", read);
    window.addEventListener("storage", read);
    return () => {
      window.removeEventListener("rsvp-updated", read);
      window.removeEventListener("storage", read);
    };
  }, [storageKey]);

  const scrollToEnvelope = () => {
    // Directly open the envelope — works in both canvas and focus modes,
    // regardless of which scroll container the sentinel lives in.
    window.dispatchEvent(new CustomEvent("open-rsvp-envelope"));
  };

  // Not yet responded — gentle prompt pointing back to the envelope
  if (!response) {
    return (
      <div style={{
        maxWidth: 520,

            textTransform: "uppercase",
            cursor: "pointer",
            transition: "background 220ms ease, color 220ms ease",
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.background = "var(--ivory)";
            e.currentTarget.style.color = "var(--sage-deep)";
          }}
          onMouseLeave={(e) => {
            e.currentTarget.style.background = "transparent";
            e.currentTarget.style.color = "var(--ivory)";
          }}
        >
          ↑ 開啟邀請函

  // Responded — confirmation summary
  const yes = response.attending === "yes";
  return (
    <div style={{

      padding: "36px 32px",

      <div className="tc" style={{
        marginTop: 14,
        fontFamily: "var(--tc)",
        fontSize: 15,
        letterSpacing: "0.12em",
        color: "var(--sage-mist)",
        lineHeight: 1.85,
      }}>
        謝謝您，{response.name}
        {yes ? (
          <> —— 期待 {response.guests} 位的蒞臨。</>
        ) : (
          <> —— 雖無法相見，仍將您的祝福放在心上。</>

      <button

  <script type="text/babel">
/* global React, ReactDOM, RSVPForm */

/* ----------------------------------------------------------
   Singleton registry — when an artboard is focused, the React
   subtree mounts twice (canvas world + focus overlay portal).
   Both would portal an envelope to document.body. We register
   each mount and only let the most-recently-mounted instance
   actually render, so there's never more than one envelope.
   ---------------------------------------------------------- */
const __envRegistry = [];
const __envSubs = new Set();
function __envNotify() { __envSubs.forEach((fn) => fn()); }
function __envActiveId() {
  return __envRegistry.length ? __envRegistry[__envRegistry.length - 1] : null;
}

/* ==========================================================
   FloatingRsvpEnvelope
   
   States:
     hidden     — before sentinel ever enters viewport
     peek       — small, fixed right-middle (after first trigger, out of zone)
     prominent  — medium, fixed center-right (sentinel in view)
     open       — large card, flap rotates open, RSVPForm inside
   ========================================================== */
function FloatingRsvpEnvelope({ storageKey }) {
  const [inZone, setInZone] = React.useState(false);
  const [hasBeenInZone, setHasBeenInZone] = React.useState(false);
  const [isOpen, setIsOpen] = React.useState(false);
  const [hasResponded, setHasResponded] = React.useState(false);

  // Singleton guard — register this instance; only the most-recent
  // mount (typically the focus-overlay copy) actually renders.
  const idRef = React.useRef(null);
  if (idRef.current === null) {
    idRef.current = Symbol("env-" + Math.random().toString(36).slice(2));
  }
  const [activeId, setActiveId] = React.useState(__envActiveId);
  React.useEffect(() => {
    __envRegistry.push(idRef.current);
    const update = () => setActiveId(__envActiveId());
    __envSubs.add(update);
    __envNotify();
    return () => {
      const i = __envRegistry.indexOf(idRef.current);
      if (i !== -1) __envRegistry.splice(i, 1);
      __envSubs.delete(update);
      __envNotify();
    };
  }, []);
  const isActive = activeId === idRef.current;

  // Listen for external open requests (e.g. from the § 05 RsvpStatus button)
  React.useEffect(() => {
    const openHandler = () => {
      setHasBeenInZone(true);  // ensure the component is rendered
      setIsOpen(true);
    };
    window.addEventListener("open-rsvp-envelope", openHandler);
    return () => window.removeEventListener("open-rsvp-envelope", openHandler);
  }, []);

  // Watch sentinel
  React.useEffect(() => {
    const sentinel = document.getElementById("rsvp-sentinel");
    if (!sentinel) return;
    const io = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInZone(true);
          setHasBeenInZone(true);
        } else {
          setInZone(false);
        }
      },
      { rootMargin: "-15% 0px -15% 0px" }
    );
    io.observe(sentinel);
    return () => io.disconnect();
  }, []);

  // Read responded state + listen for updates
  React.useEffect(() => {
    const check = () => {
      try {
        const raw = localStorage.getItem(storageKey);
        const parsed = raw ? JSON.parse(raw) : null;
        setHasResponded(!!(parsed && parsed.name && parsed.attending));
      } catch (e) { setHasResponded(false); }
    };
    check();
    window.addEventListener("rsvp-updated", check);
    window.addEventListener("storage", check);
    return () => {
      window.removeEventListener("rsvp-updated", check);
      window.removeEventListener("storage", check);
    };
  }, [storageKey]);

  // Lock scroll + Esc handler when open
  React.useEffect(() => {
    if (!isOpen) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    const onKey = (e) => { if (e.key === "Escape") setIsOpen(false); };
    document.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = prev;
      document.removeEventListener("keydown", onKey);
    };
  }, [isOpen]);

  if (!isActive) return null;
  if (!hasBeenInZone) return null;

  const mode = isOpen ? "open" : (inZone ? "prominent" : "peek");

  // Portal to document.body so position:fixed escapes the DesignCanvas
  // transform and pins to the real viewport.
  return ReactDOM.createPortal(
    <>
      <div
        className={"env-scrim " + (isOpen ? "visible" : "")}
        onClick={() => setIsOpen(false)}
        aria-hidden="true"
      />

      <div
        className={"env-wrap env-" + mode}
        onClick={() => { if (!isOpen) setIsOpen(true); }}
        role="button"
        aria-label="開啟 RSVP 邀請函"
        tabIndex={isOpen ? -1 : 0}
        onKeyDown={(e) => {
          if (!isOpen && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            setIsOpen(true);
          }
        }}
      >
        <div className="env-shell">
          {/* Back of envelope — labels visible when closed */}
          <div className="env-back">
            {/* Peek state — small wax-seal-style golden dot */}
            <div className="env-peek-icon">
              {hasResponded ? (
                <span className="env-check">✓</span>
              ) : (
                <span className="env-peek-seal" aria-hidden="true" />
              )}
            </div>

            {/* Prominent state — full message */}
            <div className="env-prominent-body">
              <div className="env-prominent-title">
                {hasResponded ? "已回覆" : "邀請函"}
              </div>
              <div className="env-prominent-sub">
                {hasResponded ? "點擊修改" : "點擊開啟"}
              </div>
            </div>
          </div>

          {/* Decorative flap (closes envelope visually) */}
          <div className="env-flap" />
          <div className="env-flap-shadow" />

          {/* Wax seal — golden Y & A monogram at flap tip */}
          <div className="env-seal" aria-hidden="true">
            <span className="env-seal-text">Y<i>&amp;</i>A</span>
          </div>

          {/* Letter — RSVP form, visible when open.
              Outer .env-letter is the sage-deep envelope frame;
              .env-letter-inner is the ivory paper inside it. */}
          <div className="env-letter">
            <button
              type="button"
              className="env-close"
              onClick={(e) => { e.stopPropagation(); setIsOpen(false); }}
              aria-label="關閉"
            >✕</button>

            <div className="env-letter-inner">
              <div className="env-letter-head">
                <div className="env-mono-label" style={{ color: "var(--sage-deep)" }}>§ R.S.V.P.</div>
                <h3 className="tc" style={{
                  fontFamily: "var(--tc)",
                  fontSize: 28,
                  marginTop: 10,
                  color: "var(--ink)",
                  letterSpacing: "0.06em",
                }}>
                  敬邀蒞臨
                </h3>
                <div style={{
                  margin: "14px auto 0",
                  width: 32, height: 1, background: "var(--sage-deep)",
                }} />
              </div>

              <div className="env-letter-body">
                <RSVPForm storageKey={storageKey} />
              </div>
            </div>
          </div>
        </div>
      </div>
    </>,
    document.body
  );
}

Object.assign(window, { FloatingRsvpEnvelope });

  </script>

/* ==========================================================
   SnowDiaryCarousel — horizontal scroll, one slide at a time
   ========================================================== */
function SnowDiaryCarousel() {
  const trackRef = React.useRef(null);
  const [active, setActive] = React.useState(0);

  const scrollTo = (i) => {
    const track = trackRef.current;
    if (!track) return;
    const slides = track.querySelectorAll("[data-slide]");
    if (!slides[i]) return;
    const left = slides[i].offsetLeft - track.offsetLeft;
    track.scrollTo({ left, behavior: "smooth" });
  };

  // Sync active index on scroll
  React.useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const slides = track.querySelectorAll("[data-slide]");
        const center = track.scrollLeft + track.clientWidth / 2;
        let best = 0, bestDist = Infinity;
        slides.forEach((s, i) => {
          const c = s.offsetLeft + s.offsetWidth / 2 - track.offsetLeft;
          const d = Math.abs(c - center);
          if (d < bestDist) { bestDist = d; best = i; }
        });
        setActive(best);
        ticking = false;
      });
    };
    track.addEventListener("scroll", onScroll, { passive: true });
    return () => track.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <div style={{ position: "relative" }}>
      {/* track */}
      <div
        ref={trackRef}
        className="snow-track"
        style={{
          display: "flex",
          gap: 32,
          overflowX: "auto",
          scrollSnapType: "x mandatory",
          paddingBottom: 16,
          scrollbarWidth: "none",
        }}
      >
        {SNOW_ENTRIES.map((e, i) => (
          <div key={e.id} data-slide
            style={{
              flex: "0 0 86%",
              scrollSnapAlign: "center",
              opacity: active === i ? 1 : 0.55,
              transition: "opacity 600ms cubic-bezier(0.22, 0.61, 0.36, 1)",
            }}>
            <div className="photo-lift" style={{
              aspectRatio: "16 / 10",
              position: "relative",
              boxShadow: "0 30px 80px rgba(42,46,42,0.15), 0 4px 12px rgba(42,46,42,0.06)",
            }}>
              <div className="photo-real" style={{
                width: "100%", height: "100%",
                backgroundImage: `url('${window.IMG(e.image)}')`,
                backgroundPosition: e.position,
              }} />
            </div>
            <div className="snow-cap" style={{
              marginTop: 24,
              display: "grid",
              gridTemplateColumns: "1fr auto 1fr",
              gap: 32,
              alignItems: "center",
            }}>
              <div style={{ textAlign: "right" }}>
                <div style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 11, letterSpacing: "0.32em", textTransform: "uppercase",
                  color: "var(--sage-deep)",
                }}>{e.fig}</div>
                <div style={{
                  marginTop: 6,
                  fontFamily: "var(--serif)", fontStyle: "italic",
                  fontSize: 17, color: "var(--sage-deep)",
                }}>{e.date}</div>
              </div>
              <h3 style={{
                fontFamily: "var(--serif)",
                fontSize: 38, lineHeight: 1.05,
                color: "var(--ink)",
                textAlign: "center",
                margin: 0,
              }}>{e.place} <i>{e.placeItalic}</i></h3>
              <p className="tc" style={{
                fontFamily: "var(--tc)",
                fontSize: 14, lineHeight: 1.85, letterSpacing: "0.06em",
                color: "var(--ink-soft)", maxWidth: 280, margin: 0,
              }}>
                {e.caption.map((c, j) => (
                  <span key={j}>{c}{j < e.caption.length - 1 ? <br/> : null}</span>
                ))}
              </p>
            </div>
          </div>
        ))}
      </div>

      {/* controls — prev/next + dots */}
      <div style={{
        marginTop: 24,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        gap: 32,
      }}>
        <button
          onClick={() => scrollTo(Math.max(0, active - 1))}
          disabled={active === 0}
          aria-label="Previous"
          style={{
            border: "1px solid var(--rule)",
            background: "transparent",
            width: 44, height: 44,
            cursor: active === 0 ? "not-allowed" : "pointer",
            color: "var(--ink)",
            opacity: active === 0 ? 0.3 : 1,
            transition: "all 0.2s ease",
            fontFamily: "var(--serif)",
            fontSize: 18,
          }}>
          ←
        </button>

        <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
          {SNOW_ENTRIES.map((e, i) => (
            <button key={e.id}
              onClick={() => scrollTo(i)}
              aria-label={`Go to ${e.place}`}
              style={{
                border: "none",
                background: "transparent",
                cursor: "pointer",
                padding: 4,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
              <span style={{
                display: "inline-block",
                width: active === i ? 32 : 8,
                height: 1,
                background: active === i ? "var(--sage-deep)" : "var(--rule)",
                transition: "all 0.4s cubic-bezier(0.22, 0.61, 0.36, 1)",
              }} />
            </button>
          ))}
        </div>

        <button
          onClick={() => scrollTo(Math.min(SNOW_ENTRIES.length - 1, active + 1))}
          disabled={active === SNOW_ENTRIES.length - 1}
          aria-label="Next"
          style={{
            border: "1px solid var(--rule)",
            background: "transparent",
            width: 44, height: 44,
            cursor: active === SNOW_ENTRIES.length - 1 ? "not-allowed" : "pointer",
            color: "var(--ink)",
            opacity: active === SNOW_ENTRIES.length - 1 ? 0.3 : 1,
            transition: "all 0.2s ease",
            fontFamily: "var(--serif)",
            fontSize: 18,
          }}>
          →
        </button>
      </div>

      {/* count */}
      <div style={{
        marginTop: 16,
        textAlign: "center",
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 11, letterSpacing: "0.32em",
        color: "var(--sage-deep)",
      }}>
        {String(active + 1).padStart(2, "0")} / {String(SNOW_ENTRIES.length).padStart(2, "0")}
      </div>
    </div>
  );
}
